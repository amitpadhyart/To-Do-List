<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentum — Smart To-Do</title>
<style>
:root{--bg:#0b1020;--panel:#121a2e;--panel2:#17223a;--text:#eef3ff;--muted:#91a0bd;--line:#273450;--accent:#8b9cff;--good:#36d399}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#182448 0%,#0b1020 55%);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial}
button,input,select{font:inherit}button{cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:34px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#8b9cff,#57e3c2);display:grid;place-items:center;color:#0b1020;font-weight:900;font-size:21px;box-shadow:0 8px 25px #5d80ff30}
h1{font-size:23px;letter-spacing:-.7px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:2px}
.date{color:var(--muted);font-size:13px;text-align:right}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;margin-bottom:20px}
.card{background:linear-gradient(145deg,#151e34ee,#10182aee);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 18px 45px #00000018}
.gauge-card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;position:relative;overflow:hidden}
.gauge-card:before{content:"";position:absolute;width:250px;height:250px;border-radius:50%;background:#5f79ff0b;filter:blur(20px);top:20px}
.gauge-title{align-self:flex-start;z-index:1}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted)}
.gauge{width:min(100%,350px);position:relative;z-index:1;margin-top:6px}.gauge svg{width:100%;display:block;overflow:visible}
.gauge-value{position:absolute;left:0;right:0;top:48%;transform:translateY(-15%);text-align:center;font-size:45px;line-height:1;font-weight:800;letter-spacing:-2px}
.gauge-value small{font-size:15px;letter-spacing:0;color:var(--muted);font-weight:600}
.gauge-caption{text-align:center;color:var(--muted);font-size:13px;margin-top:-4px;z-index:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;width:100%;z-index:1}
.stat{background:#0c1426a8;border:1px solid #24314d;border-radius:14px;padding:12px;text-align:center}.stat strong{display:block;font-size:21px}.stat span{color:var(--muted);font-size:11px}
.side h2,.tasks-head h2{margin:0;font-size:18px;letter-spacing:-.4px}.side p{color:var(--muted);font-size:13px;margin:5px 0 20px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}.field label{font-size:12px;color:#b5c1d9;font-weight:700}
input,select{width:100%;background:#0b1325;border:1px solid #2b3958;border-radius:11px;color:var(--text);padding:12px 13px;outline:none;transition:.2s}
input:focus,select:focus{border-color:#8495ff;box-shadow:0 0 0 3px #8495ff20}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.primary{border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(110deg,#8b9cff,#66e2c1);color:#0b1222;font-weight:850;transition:transform .18s,filter .18s;width:100%}.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.tasks{padding:22px}.tasks-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.task-count{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.search{flex:1;min-width:170px}.toolbar select{width:auto;min-width:130px;padding:10px 12px}
.task-list{display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:center;gap:13px;background:#0d1629;border:1px solid #24314b;border-radius:15px;padding:14px 15px;transition:border-color .2s,transform .2s}
.task:hover{border-color:#475a81;transform:translateY(-1px)}.check{appearance:none;width:22px;height:22px;min-width:22px;padding:0;border:2px solid #53627f;border-radius:7px;display:grid;place-items:center;cursor:pointer;background:transparent}
.check:checked{background:var(--good);border-color:var(--good)}.check:checked:after{content:"✓";font-weight:900;color:#092017;font-size:14px}
.task-main{flex:1;min-width:0}.task-title{font-weight:700;overflow-wrap:anywhere}.task.done .task-title{text-decoration:line-through;color:#7e8aa5}.task-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:5px}
.pill{padding:2px 8px;border-radius:99px;font-weight:750;font-size:10px;letter-spacing:.3px;text-transform:uppercase}.p-high{background:#ff5f6d20;color:#ff828b}.p-medium{background:#ffc85720;color:#ffd16d}.p-low{background:#4fd1a620;color:#64e6bc}.overdue{color:#ff828b}
.delete{background:transparent;border:1px solid transparent;color:#75839f;border-radius:9px;padding:7px 9px;font-size:17px}.delete:hover{color:#ff828b;border-color:#ff828b44;background:#ff828b0c}
.empty{text-align:center;padding:40px 16px;color:var(--muted);border:1px dashed #33415f;border-radius:15px}.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:5px}
.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:17px;color:var(--muted);font-size:12px}.text-btn{background:transparent;border:0;color:#aab8ff;padding:4px 0}.text-btn:hover{color:white}
@media(max-width:760px){.hero{grid-template-columns:1fr}.gauge-card{min-height:300px}.wrap{padding:22px 13px 40px}.card{padding:19px}.date{display:none}}
@media(max-width:440px){.form-row{grid-template-columns:1fr;gap:0}.stats{gap:6px}.stat{padding:10px 5px}.stat strong{font-size:18px}.tasks-head{align-items:flex-start;flex-direction:column}.toolbar select{flex:1}.task{padding:12px 10px;gap:9px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">↗</div><div><h1>Momentum</h1><div class="sub">Your day, in motion.</div></div></div>
    <div class="date" id="today"></div>
  </header>
  <section class="hero">
    <div class="card gauge-card">
      <div class="gauge-title"><div class="eyebrow">Daily performance</div></div>
      <div class="gauge">
        <svg viewBox="0 0 320 190" role="img" aria-label="Task completion speedometer">
          <defs><linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ff4d5a"/><stop offset="50%" stop-color="#ffc857"/><stop offset="100%" stop-color="#36d399"/></linearGradient></defs>
          <path d="M 34 160 A 126 126 0 0 1 286 160" fill="none" stroke="#273450" stroke-width="19" stroke-linecap="round"/>
          <path id="progressArc" d="M 34 160 A 126 126 0 0 1 286 160" fill="none" stroke="url(#gaugeGradient)" stroke-width="19" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" style="transition:stroke-dasharray .7s cubic-bezier(.2,.8,.2,1)"/>
          <g id="ticks" stroke="#657392" stroke-width="2" stroke-linecap="round"></g>
          <circle cx="160" cy="160" r="8" fill="#dfe7ff"/>
          <path id="needle" d="M160 160 L160 55" stroke="#f5f7ff" stroke-width="4" stroke-linecap="round" style="transform-origin:160px 160px;transform:rotate(-90deg);transition:transform .7s cubic-bezier(.2,.8,.2,1)"/>
        </svg>
        <div class="gauge-value"><span id="percent">0</span><small>%</small></div>
      </div>
      <div class="gauge-caption" id="gaugeCaption">Start with one small win.</div>
      <div class="stats">
        <div class="stat"><strong id="completedStat">0</strong><span>COMPLETED</span></div>
        <div class="stat"><strong id="remainingStat">0</strong><span>REMAINING</span></div>
        <div class="stat"><strong id="totalStat">0</strong><span>TOTAL TASKS</span></div>
      </div>
    </div>
    <div class="card side">
      <div class="eyebrow">Build your momentum</div><h2 style="margin-top:5px">Add a task</h2>
      <p>Every completed task moves your needle closer to green.</p>
      <form id="taskForm">
        <div class="field"><label for="taskInput">TASK NAME</label><input id="taskInput" maxlength="140" placeholder="e.g. Finish project documentation" required autocomplete="off"></div>
        <div class="form-row">
          <div class="field"><label for="priority">PRIORITY</label><select id="priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div>
          <div class="field"><label for="dueDate">DUE DATE (OPTIONAL)</label><input id="dueDate" type="date"></div>
        </div>
        <button class="primary" type="submit">＋ Add task</button>
      </form>
    </div>
  </section>
  <section class="card tasks">
    <div class="tasks-head"><div><h2>Your task list</h2><div class="sub">Keep it clear. Keep it moving.</div></div><div class="task-count" id="listCount">0 tasks</div></div>
    <div class="toolbar">
      <input class="search" id="searchInput" placeholder="⌕  Search tasks…" aria-label="Search tasks">
      <select id="filterSelect" aria-label="Filter tasks"><option value="all">All tasks</option><option value="active">Active</option><option value="completed">Completed</option><option value="overdue">Overdue</option></select>
      <select id="sortSelect" aria-label="Sort tasks"><option value="created">Recently added</option><option value="priority">Priority</option><option value="due">Due date</option><option value="alpha">Alphabetical</option></select>
    </div>
    <div class="task-list" id="taskList"></div>
    <div class="footer"><span id="footerHint">Saved automatically on this device.</span><button class="text-btn" id="clearCompleted" type="button">Clear completed</button></div>
  </section>
</div>
<script>
const STORAGE_KEY = 'momentum-tasks-v1';
let tasks = [];
try { tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); if (!Array.isArray(tasks)) tasks = []; } catch { tasks = []; }
const $ = id => document.getElementById(id);
const todayISO = () => { const d = new Date(); d.setHours(0,0,0,0); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
$('today').textContent = new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:'numeric'});
// Draw subtle tick marks along the speedometer arc.
for(let i=0;i<=10;i++){
  const angle=(-180+i*18)*Math.PI/180, r1=109, r2=116, cx=160, cy=160;
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',cx+Math.cos(angle)*r1); line.setAttribute('y1',cy+Math.sin(angle)*r1);
  line.setAttribute('x2',cx+Math.cos(angle)*r2); line.setAttribute('y2',cy+Math.sin(angle)*r2);
  $('ticks').appendChild(line);
}
function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks)); }
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function isOverdue(t){return !t.completed && t.dueDate && t.dueDate < todayISO();}
function updateGauge(){
  const total=tasks.length, done=tasks.filter(t=>t.completed).length, remaining=total-done;
  const pct=total ? Math.round(done/total*100) : 0;
  $('percent').textContent=pct; $('completedStat').textContent=done; $('remainingStat').textContent=remaining; $('totalStat').textContent=total;
  $('progressArc').style.strokeDasharray=`${pct} 100`;
  $('needle').style.transform=`rotate(${-90+pct*1.8}deg)`;
  $('gaugeCaption').textContent = total===0 ? 'Add a task to start your engine.' : pct===100 ? 'Full throttle — everything is done!' : pct>=75 ? 'Nearly there. Finish strong.' : pct>=40 ? 'Good momentum. Keep going.' : pct>0 ? 'Nice start. Build on that win.' : 'Start with one small win.';
  $('listCount').textContent=`${total} task${total===1?'':'s'}`;
  $('footerHint').textContent = total ? `${done} of ${total} completed · ${tasks.filter(isOverdue).length} overdue` : 'Saved automatically on this device.';
}
function render(){
  updateGauge();
  const query=$('searchInput').value.trim().toLowerCase(), filter=$('filterSelect').value, sort=$('sortSelect').value;
  let visible=tasks.filter(t=>{
    const matches=t.title.toLowerCase().includes(query);
    const state=filter==='all'||(filter==='active'&&!t.completed)||(filter==='completed'&&t.completed)||(filter==='overdue'&&isOverdue(t));
    return matches&&state;
  });
  const ranks={high:0,medium:1,low:2};
  visible.sort((a,b)=>{
    if(sort==='priority') return ranks[a.priority]-ranks[b.priority] || b.createdAt-a.createdAt;
    if(sort==='due') return (a.dueDate||'9999').localeCompare(b.dueDate||'9999');
    if(sort==='alpha') return a.title.localeCompare(b.title);
    return b.createdAt-a.createdAt;
  });
  const list=$('taskList');
  if(!visible.length){
    list.innerHTML=`<div class="empty"><b>${tasks.length ? 'No matching tasks' : 'Your runway is clear.'}</b>${tasks.length ? 'Try another search or filter.' : 'Add your first task above and start building momentum.'}</div>`;
    return;
  }
  list.innerHTML=visible.map(t=>{
    const overdue=isOverdue(t);
    const due=t.dueDate ? `<span class="${overdue?'overdue':''}">${overdue?'Overdue · ': 'Due · '}${new Date(t.dueDate+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>` : '';
    return `<div class="task ${t.completed?'done':''}" data-id="${t.id}">
      <input class="check" type="checkbox" aria-label="Mark ${escapeHTML(t.title)} complete" ${t.completed?'checked':''}>
      <div class="task-main"><div class="task-title">${escapeHTML(t.title)}</div><div class="task-meta"><span class="pill p-${t.priority}">${t.priority}</span>${due}</div></div>
      <button class="delete" type="button" aria-label="Delete task" title="Delete task">×</button>
    </div>`;
  }).join('');
}
$('taskForm').addEventListener('submit',e=>{
  e.preventDefault(); const title=$('taskInput').value.trim(); if(!title)return;
  tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),title,priority:$('priority').value,dueDate:$('dueDate').value,completed:false,createdAt:Date.now()});
  save(); $('taskInput').value=''; $('dueDate').value=''; $('priority').value='medium'; render(); $('taskInput').focus();
});
$('taskList').addEventListener('change',e=>{
  if(!e.target.classList.contains('check'))return;
  const task=e.target.closest('.task'); const t=tasks.find(x=>x.id===task.dataset.id); if(t){t.completed=e.target.checked;save();render();}
});
$('taskList').addEventListener('click',e=>{
  const btn=e.target.closest('.delete'); if(!btn)return;
  const task=btn.closest('.task'); tasks=tasks.filter(t=>t.id!==task.dataset.id);save();render();
});
['searchInput','filterSelect','sortSelect'].forEach(id=>$(id).addEventListener(id==='searchInput'?'input':'change',render));
$('clearCompleted').addEventListener('click',()=>{tasks=tasks.filter(t=>!t.completed);save();render();});
render();
</script>
</body>
</html>
